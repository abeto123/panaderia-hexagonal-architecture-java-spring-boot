<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Acceso denegado')"></head>
<body class="bg-light">
    <nav th:replace="fragments/header :: navbar"></nav>

    <div class="container py-5 text-center">
        <div class="denied-card mx-auto">
            <i class="fas fa-lock denied-icon"></i>
            <h1 class="fw-bold mt-3">Acceso denegado</h1>
            <p class="text-muted mb-4">No tienes permisos para ver esta página. Si crees que esto es un error,
                contacta al administrador.</p>
            <a class="btn btn-primary btn-lg" th:href="@{/}">Volver al inicio</a>
        </div>
    </div>

    <style>
        .denied-card{
            max-width:480px;
            background:#fff;
            border-radius:24px;
            padding:48px 32px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }
        .denied-icon{
            font-size:3rem;
            color:var(--panaderia-primary, #b5651d);
        }
    </style>

    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
