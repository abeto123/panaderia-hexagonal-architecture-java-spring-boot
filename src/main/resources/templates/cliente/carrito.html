<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Mi Carrito')"></head>
<body class="bg-light">
    <nav th:replace="fragments/header :: navbar"></nav>

    <div class="container py-4">
        <h1 class="fw-bold mb-4">Mi Carrito</h1>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${#lists.isEmpty(items)}" class="card panaderia-card">
            <div class="card-body text-center py-5">
                <i class="fas fa-shopping-basket empty-cart-icon mb-3"></i>
                <p class="mb-3">Tu carrito está vacío.</p>
                <a class="btn btn-primary" th:href="@{/productos}">Ver catálogo</a>
            </div>
        </div>

        <div th:if="${!#lists.isEmpty(items)}" class="card panaderia-card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th style="width: 180px;">Cantidad</th>
                                <th>Subtotal</th>
                                <th class="text-end">Quitar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${items}" th:classappend="${item.cantidad < item.compraMinima} ? 'table-warning' : ''">
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <img th:if="${item.foto}" th:src="${item.foto}" class="cart-item-img" alt="">
                                        <div>
                                            <div th:text="${item.nombre}">Producto</div>
                                            <small class="text-muted" th:if="${item.compraMinima > 1}">
                                                Compra mínima: <span th:text="${item.compraMinima}">1</span> unidades
                                            </small>
                                        </div>
                                    </div>
                                </td>
                                <td>S/ <span th:text="${item.precioUnitario}">0.00</span></td>
                                <td>
                                    <form th:action="@{/cliente/carrito/actualizar}" method="post" class="d-flex gap-2">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <input type="hidden" name="productoId" th:value="${item.productoId}" />
                                        <input type="number" name="cantidad" class="form-control form-control-sm"
                                               th:min="${item.compraMinima}"
                                               th:max="${item.stockDisponible}" th:value="${item.cantidad}" style="width:80px;" />
                                        <button type="submit" class="btn btn-sm btn-outline-secondary">Actualizar</button>
                                    </form>
                                    <small class="text-danger d-block mt-1" th:if="${item.cantidad < item.compraMinima}">
                                        Debes llevar al menos <span th:text="${item.compraMinima}">1</span>
                                    </small>
                                </td>
                                <td>S/ <span th:text="${item.subtotal}">0.00</span></td>
                                <td class="text-end">
                                    <form th:action="@{'/cliente/carrito/eliminar/' + ${item.productoId}}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-delete" title="Eliminar producto">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-3">
                    <form th:action="@{/cliente/carrito/vaciar}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-outline-secondary">
                            <i class="fas fa-broom"></i> Vaciar carrito
                        </button>
                    </form>
                    <div class="text-end">
                        <h4 class="mb-2">Total: S/ <span th:text="${total}">0.00</span></h4>
                        <a class="btn btn-success btn-lg" th:href="@{/cliente/checkout}"
                           th:if="${items.?[cantidad < compraMinima].isEmpty()}">
                            Continuar con el pedido <i class="fas fa-arrow-right"></i>
                        </a>
                        <button class="btn btn-secondary btn-lg" disabled
                                th:if="${!items.?[cantidad < compraMinima].isEmpty()}">
                            Ajusta las cantidades mínimas
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .cart-item-img{
            width:56px;height:56px;object-fit:cover;border-radius:12px;
        }
        .empty-cart-icon{
            font-size:3rem;
            color:var(--panaderia-primary, #b5651d);
            opacity:0.6;
        }
    </style>

    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
