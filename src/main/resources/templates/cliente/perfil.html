<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Mi Perfil')"></head>
<body>
    <nav th:replace="fragments/header :: navbar"></nav>

    <div class="container mt-4">
        <h1 class="mb-4">Mi Perfil</h1>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-lg rounded-4 mb-4">
                    <div class="card-header">Mis Datos</div>
                    <div class="card-body">
                        <form th:action="@{/cliente/perfil}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="mb-3">
                                <label for="nombres" class="form-label">Nombres</label>
                                <input type="text" class="form-control" id="nombres" name="nombres" th:value="${cliente.nombres}" required>
                            </div>
                            <div class="mb-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" name="apellidos" th:value="${cliente.apellidos}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:value="${cliente.email}" disabled>
                                <div class="form-text">El email no se puede modificar porque es tu usuario de acceso.</div>
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="telefono" name="telefono" th:value="${cliente.telefono}">
                            </div>
                            <div class="mb-3">
                                <label for="ruc" class="form-label">RUC (opcional, para factura)</label>
                                <input type="text" class="form-control" id="ruc" name="ruc" th:value="${cliente.ruc != null ? cliente.ruc.valor : ''}">
                            </div>
                            <div class="mb-3">
                                <label for="razonSocial" class="form-label">Razón Social (opcional, para factura)</label>
                                <input type="text" class="form-control" id="razonSocial" name="razonSocial" th:value="${cliente.razonSocial != null ? cliente.razonSocial.valor : ''}">
                            </div>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                            <a class="btn btn-outline-secondary" th:href="@{/cliente/direcciones}">Mis Direcciones</a>
                        </form>
                    </div>
                </div>

                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-header">Cambiar Contraseña</div>
                    <div class="card-body">
                        <form th:action="@{/cliente/perfil/password}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="mb-3">
                                <label for="passwordActual" class="form-label">Contraseña Actual</label>
                                <input type="password" class="form-control" id="passwordActual" name="passwordActual" required>
                            </div>
                            <div class="mb-3">
                                <label for="passwordNueva" class="form-label">Nueva Contraseña</label>
                                <input type="password" class="form-control" id="passwordNueva" name="passwordNueva" minlength="6" required>
                            </div>
                            <div class="mb-3">
                                <label for="passwordConfirmar" class="form-label">Confirmar Nueva Contraseña</label>
                                <input type="password" class="form-control" id="passwordConfirmar" name="passwordConfirmar" minlength="6" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Cambiar Contraseña</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
