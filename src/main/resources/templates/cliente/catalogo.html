<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/header :: head('Catálogo')"></head>

<body class="bg-light">

    <nav th:replace="fragments/header :: navbar"></nav>

    <div class="container py-5">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Catálogo de Productos 
            </h1>

            <p class="text-muted">
                Descubre nuestros productos más deliciosos
            </p>

        </div>

        <div class="row">

            <div class="col-md-3 mb-4">

                <div class="card border-0 shadow-sm category-card">

                    <div class="card-body">

                        <h5 class="fw-bold mb-3">
                            Categorías
                        </h5>

                        <ul class="list-group list-group-flush">

                            <li class="list-group-item bg-transparent border-0 px-0">

                                <a class="category-link"
                                   th:href="@{/productos}">

                                    Todas

                                </a>

                            </li>

                            <li class="list-group-item bg-transparent border-0 px-0"
                                th:each="cat : ${categorias}">

                                <a class="category-link"
                                   th:href="@{/productos(categoria=${cat})}"
                                   th:text="${cat}">

                                    Categoría

                                </a>

                            </li>

                        </ul>

                    </div>

                </div>

            </div>

            <div class="col-md-9">

                <div class="row">

                    <div class="col-md-4 mb-4"
                         th:each="producto : ${productos}">

                        <div class="card product-card h-100 border-0 shadow-sm">

                            <div class="product-image-container">

                               <img th:src="${producto.imagenUrl}"
                                src="https://picsum.photos/300/200"
                                class="card-img-top product-image"
                                alt="Producto">

                            </div>

                            <div class="card-body d-flex flex-column">

                                <h5 class="card-title fw-bold"
                                    th:text="${producto.nombre}">

                                    Nombre

                                </h5>

                                <p class="card-text text-muted small"
                                   th:text="${producto.descripcion}">

                                    Descripción

                                </p>

                                <div class="mt-auto">

                                    <p class="price-text">

                                        S/
                                        <span th:text="${producto.precio.valor}">
                                            0.00
                                        </span>

                                    </p>

                                    <p class="stock-text">

                                        Stock:
                                        <span th:text="${producto.stock.cantidad}">
                                            0
                                        </span>

                                    </p>

                                    <p class="min-qty-text" th:if="${comprasMinimas.get(producto.id) != null and comprasMinimas.get(producto.id) > 1}">
                                        <i class="fas fa-box"></i>
                                        Compra mínima: <span th:text="${comprasMinimas.get(producto.id)}">1</span> unidades
                                    </p>

                                    <div class="d-grid" sec:authorize="hasRole('CLIENTE')">

                                        <form th:action="@{/cliente/carrito/agregar}" method="post" class="d-flex gap-2 mb-2">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <input type="hidden" name="productoId" th:value="${producto.id}" />
                                            <input type="number" name="cantidad" class="form-control form-control-sm"
                                                   th:min="${comprasMinimas.get(producto.id) != null ? comprasMinimas.get(producto.id) : 1}"
                                                   th:value="${comprasMinimas.get(producto.id) != null ? comprasMinimas.get(producto.id) : 1}"
                                                   style="width:90px;" />
                                            <button type="submit" class="btn btn-primary add-cart-btn flex-grow-1"
                                                    th:disabled="${producto.stock.cantidad <= 0 or !producto.disponible}">
                                                <i class="fas fa-shopping-cart"></i>
                                                Agregar
                                            </button>
                                        </form>

                                    </div>

                                    <div class="d-grid" sec:authorize="!isAuthenticated()">
                                        <a class="btn btn-outline-primary" th:href="@{/loginPage}">Inicia sesión para comprar</a>
                                    </div>


                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <style>

        body{
            background:var(--panaderia-cream, #fff8ef);
        }

        .category-card{
            border-radius:20px;
        }

        .category-link{
            text-decoration:none;
            color:#2f3640;
            font-weight:500;
            transition:0.2s;
        }

        .category-link:hover{
            color:var(--panaderia-primary, #b5651d);
            padding-left:5px;
        }

        .product-card{
            border-radius:20px;
            overflow:hidden;
            transition:0.3s;
        }

        .product-card:hover{
            transform:translateY(-5px);
        }

        .product-image-container{
            height:220px;
            overflow:hidden;
            background:#fff;
        }

        .product-image{
            width:100%;
            height:100%;
            object-fit:cover;
            transition:0.3s;
        }

        .product-card:hover .product-image{
            transform:scale(1.05);
        }

        .price-text{
            font-size:1.2rem;
            font-weight:bold;
            color:var(--panaderia-primary, #b5651d);
            margin-bottom:5px;
        }

        .stock-text{
            color:#718093;
            font-size:0.9rem;
        }

        .min-qty-text{
            color:var(--panaderia-primary-dark, #8f4f16);
            font-size:0.85rem;
            font-weight:600;
        }

        .add-cart-btn{
            border-radius:12px;
            padding:10px;
            font-weight:600;
        }

    </style>

    <footer th:replace="fragments/footer :: footer"></footer>

</body>

</html>
