<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Detalle de Pedido')"></head>
<body>
    <nav th:replace="fragments/header :: navbar"></nav>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="'Pedido #' + ${pedido.id}">Pedido #1</h1>
            <a class="btn btn-secondary" th:href="@{/cliente/pedidos}">Volver a mis pedidos</a>
        </div>

        <div class="row">
            <div class="col-md-7 mb-4">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header">Productos</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="d : ${detalles}">
                            <div class="d-flex align-items-center gap-2">
                                <img th:if="${d.foto}" th:src="${d.foto}" style="width:45px;height:45px;object-fit:cover;border-radius:8px;" alt="">
                                <span th:text="${d.nombre} + ' x' + ${d.cantidad}">Producto x1</span>
                            </div>
                            <span th:text="'S/ ' + ${d.subtotal}">S/ 0.00</span>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-header">Resumen</div>
                    <div class="card-body">
                        <p><strong>Estado:</strong> <span class="badge bg-secondary" th:text="${pedido.estado}">-</span></p>
                        <p><strong>Fecha de pedido:</strong> <span th:text="${pedido.fechaRegistro}">-</span></p>
                        <p><strong>Fecha de entrega:</strong> <span th:text="${pedido.fechaEntrega}">-</span></p>
                        <p><strong>Tipo de entrega:</strong> <span th:text="${pedido.tipoEntrega}">-</span></p>
                        <p th:if="${pedido.calle}">
                            <strong>Dirección:</strong>
                            <span th:text="${pedido.calle} + ' ' + ${pedido.numero} + ', ' + ${pedido.distritoNombre}">-</span>
                        </p>
                        <hr/>
                        <p class="d-flex justify-content-between"><span>Subtotal</span><span th:text="'S/ ' + ${pedido.subtotalProductos}">-</span></p>
                        <p class="d-flex justify-content-between"><span>Envío</span><span th:text="'S/ ' + ${pedido.costoEnvio}">-</span></p>
                        <p class="d-flex justify-content-between fw-bold fs-5"><span>Total</span><span th:text="'S/ ' + ${pedido.costoTotal}">-</span></p>

                        <a class="btn btn-outline-primary w-100 mt-3" th:if="${pagado}"
                           th:href="@{'/cliente/pedidos/' + ${pedido.id} + '/comprobante'}">
                            <i class="fas fa-file-pdf"></i> Descargar comprobante
                        </a>
                        <button class="btn btn-outline-secondary w-100 mt-3" type="button" disabled th:if="${!pagado}">
                            <i class="fas fa-file-pdf"></i> Comprobante disponible tras el pago
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
