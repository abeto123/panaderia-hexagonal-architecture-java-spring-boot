<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Mis Direcciones')"></head>
<body class="bg-light">
    <nav th:replace="fragments/header :: navbar"></nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="fw-bold mb-1">Mis Direcciones</h1>
                <p class="text-muted mb-0">Administra tus direcciones para el delivery.</p>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/cliente/perfil}">
                <i class="fas fa-arrow-left"></i> Volver a mi perfil
            </a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card panaderia-card mb-4">
            <div class="card-header">
                <i class="fas fa-plus-circle"></i> Agregar Dirección
            </div>
            <div class="card-body">
                <form th:action="@{/cliente/direcciones}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Alias</label>
                            <input type="text" name="alias" class="form-control" placeholder="Casa, Trabajo..." />
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Calle</label>
                            <input type="text" name="calle" class="form-control" required />
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Número</label>
                            <input type="text" name="numero" class="form-control" />
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Departamento</label>
                            <select id="departamento_select" class="form-select"></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Provincia</label>
                            <select id="provincia_select" class="form-select"></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Distrito</label>
                            <select id="distrito_select" name="id_distrito" class="form-select"></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Referencia</label>
                            <input type="text" name="referencia" class="form-control" />
                        </div>
                    </div>
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> Agregar Dirección</button>
                </form>
            </div>
        </div>

        <div class="card panaderia-card">
            <div class="card-header"><i class="fas fa-map-marker-alt"></i> Direcciones Guardadas</div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table mb-0 align-middle">
                        <thead>
                            <tr>
                                <th>Alias</th>
                                <th>Dirección</th>
                                <th>Referencia</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="d : ${direcciones}">
                                <td th:text="${d.alias}">Casa</td>
                                <td th:text="${d.calle} + ' ' + ${d.numero} + ' (' + ${d.distrito} + ')'">Calle</td>
                                <td th:text="${d.referencia}">Ref</td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-primary btn-editar-direccion"
                                            th:attr="data-id=${d.id},data-distrito=${d.idDistrito}"
                                            th:data-alias="${d.alias}" th:data-calle="${d.calle}"
                                            th:data-numero="${d.numero}" th:data-referencia="${d.referencia}"
                                            data-bs-toggle="modal" data-bs-target="#modalEditarDireccion">
                                        <i class="fas fa-pen"></i>
                                    </button>
                                    <form th:action="@{'/cliente/direcciones/' + ${d.id} + '/eliminar'}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Eliminar esta dirección?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-sm btn-delete" title="Eliminar dirección">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${direcciones.size()} == 0">
                                <td colspan="4" class="text-center py-4 text-muted">Todavía no tienes direcciones guardadas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal editar dirección -->
    <div class="modal fade" id="modalEditarDireccion" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="formEditarDireccion" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fas fa-pen"></i> Editar Dirección</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Alias</label>
                                <input type="text" name="alias" id="edit_alias" class="form-control" />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Calle</label>
                                <input type="text" name="calle" id="edit_calle" class="form-control" required />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Número</label>
                                <input type="text" name="numero" id="edit_numero" class="form-control" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Departamento</label>
                                <select id="edit_departamento_select" class="form-select"></select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Provincia</label>
                                <select id="edit_provincia_select" class="form-select"></select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Distrito</label>
                                <select id="edit_distrito_select" name="id_distrito" class="form-select"></select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Referencia</label>
                            <input type="text" name="referencia" id="edit_referencia" class="form-control" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="fragments/footer :: footer"></footer>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const contextPath = /*[[@{/}]]*/ '/';

            function fetchJSON(url) {
                return fetch(url).then(r => r.ok ? r.json() : Promise.reject(r.statusText));
            }

            function setupCascada(deptSel, provSel, distSel) {
                function loadDepartamentos(onLoaded) {
                    fetchJSON(contextPath + 'api/geo/departamentos')
                        .then(data => {
                            deptSel.innerHTML = '<option value="">Seleccione</option>' + data.map(d => `<option value="${d.id}">${d.nombre}</option>`).join('');
                            if (onLoaded) onLoaded();
                        })
                        .catch(() => { deptSel.innerHTML = '<option value="">Error</option>'; });
                }

                deptSel.addEventListener('change', function() {
                    const deptId = this.value;
                    provSel.innerHTML = '<option value="">Seleccione departamento</option>';
                    distSel.innerHTML = '<option value="">Seleccione provincia</option>';
                    if (!deptId) return;
                    fetchJSON(contextPath + 'api/geo/provincias/' + deptId)
                        .then(data => {
                            provSel.innerHTML = '<option value="">Seleccione</option>' + data.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
                        }).catch(() => { provSel.innerHTML = '<option value="">Error</option>'; });
                });

                provSel.addEventListener('change', function() {
                    const provId = this.value;
                    distSel.innerHTML = '<option value="">Seleccione provincia</option>';
                    if (!provId) return;
                    fetchJSON(contextPath + 'api/geo/distritos/' + provId)
                        .then(data => {
                            distSel.innerHTML = '<option value="">Seleccione</option>' + data.map(d => `<option value="${d.id}">${d.nombre}</option>`).join('');
                        }).catch(() => { distSel.innerHTML = '<option value="">Error</option>'; });
                });

                loadDepartamentos();
            }

            setupCascada(
                document.getElementById('departamento_select'),
                document.getElementById('provincia_select'),
                document.getElementById('distrito_select')
            );

            // ----- Modal de edición -----
            const editDept = document.getElementById('edit_departamento_select');
            const editProv = document.getElementById('edit_provincia_select');
            const editDist = document.getElementById('edit_distrito_select');
            setupCascada(editDept, editProv, editDist);

            const formEditar = document.getElementById('formEditarDireccion');

            document.querySelectorAll('.btn-editar-direccion').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    const distritoId = this.getAttribute('data-distrito');

                    document.getElementById('edit_alias').value = this.getAttribute('data-alias') || '';
                    document.getElementById('edit_calle').value = this.getAttribute('data-calle') || '';
                    document.getElementById('edit_numero').value = this.getAttribute('data-numero') || '';
                    document.getElementById('edit_referencia').value = this.getAttribute('data-referencia') || '';
                    formEditar.action = contextPath + 'cliente/direcciones/' + id + '/editar';

                    if (!distritoId || distritoId === 'null') {
                        return;
                    }
                    fetchJSON(contextPath + 'api/geo/distritos/' + distritoId + '/jerarquia')
                        .then(jerarquia => {
                            if (!jerarquia.departamentoId) return;
                            editDept.value = jerarquia.departamentoId;
                            return fetchJSON(contextPath + 'api/geo/provincias/' + jerarquia.departamentoId)
                                .then(data => {
                                    editProv.innerHTML = '<option value="">Seleccione</option>' + data.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
                                    editProv.value = jerarquia.provinciaId;
                                    return fetchJSON(contextPath + 'api/geo/distritos/' + jerarquia.provinciaId);
                                })
                                .then(data => {
                                    editDist.innerHTML = '<option value="">Seleccione</option>' + data.map(d => `<option value="${d.id}">${d.nombre}</option>`).join('');
                                    editDist.value = jerarquia.distritoId;
                                });
                        })
                        .catch(() => { /* si falla, el usuario puede seleccionar manualmente */ });
                });
            });
        });
    </script>
</body>
</html>
