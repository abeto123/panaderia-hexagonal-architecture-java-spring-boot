name: MVP Continuous Integration

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: PanaderiaBarriosDB
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Import DB schema
        run: mysql -h 127.0.0.1 -u root < panaderiaDB.sql

      - name: Build and run tests
        run: mvn clean verify

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Create SCM status report
        if: always()
        run: |
          echo '{' > scm-status-report.json
          echo '  "pr": "${{ github.event.pull_request.number }}",' >> scm-status-report.json
          echo '  "branch": "${{ github.head_ref }}",' >> scm-status-report.json
          echo '  "commit": "${{ github.sha }}",' >> scm-status-report.json
          echo '  "status": "${{ job.status }}",' >> scm-status-report.json
          echo '  "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"' >> scm-status-report.json
          echo '}' >> scm-status-report.json
          cat scm-status-report.json

      - name: Upload SCM status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scm-status-report
          path: scm-status-report.json