name: MVP Continuous Integration

# Permisos necesarios para que el workflow pueda actualizar el repo (commit del log)
permissions:
  contents: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run tests
        run: mvn clean verify

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Create SCM status report
        if: always()
        run: |
          echo '{' > scm-status-report.json
          echo '  "pr": "${{ github.event.pull_request.number }}",' >> scm-status-report.json
          echo '  "branch": "${{ github.head_ref }}",' >> scm-status-report.json
          echo '  "commit": "${{ github.sha }}",' >> scm-status-report.json
          echo '  "status": "${{ job.status }}",' >> scm-status-report.json
          echo '  "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"' >> scm-status-report.json
          echo '}' >> scm-status-report.json
          cat scm-status-report.json

      - name: Upload SCM status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scm-status-report
          path: scm-status-report.json

  publish-scm-log:
    # Only run this job on a push to main (i.e. after a successful merge)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update scm-status-report.json with PR metadata
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            // Try to find the PR that produced this merge commit
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'closed', per_page: 100 });
            const pr = prs.find(p => p.merge_commit_sha === sha);

            const entry = {
              pr: pr ? pr.number : null,
              title: pr ? pr.title : null,
              merged_by: pr && pr.merged_by ? pr.merged_by.login : null,
              merged_at: pr ? pr.merged_at : new Date().toISOString(),
              commit: sha,
              author: pr ? pr.user.login : null,
              branch: pr ? pr.head.ref : null,
              timestamp: new Date().toISOString()
            };

            const path = 'scm-status-report.json';
            try {
              // Read existing file (if any)
              const { data: fileData } = await github.rest.repos.getContent({ owner, repo, path });
              const content = Buffer.from(fileData.content, 'base64').toString();
              let current = JSON.parse(content);
              if (!Array.isArray(current)) current = [current];
              current.push(entry);
              const newContent = Buffer.from(JSON.stringify(current, null, 2)).toString('base64');
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, message: `chore(scm): add status for PR ${entry.pr || sha}`,
                content: newContent, sha: fileData.sha, branch: 'main'
              });
              console.log('scm-status-report.json updated');
            } catch (e) {
              // File does not exist -> create it
              const newContent = Buffer.from(JSON.stringify([entry], null, 2)).toString('base64');
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, message: `chore(scm): create scm-status-report with PR ${entry.pr || sha}`,
                content: newContent, branch: 'main'
              });
              console.log('scm-status-report.json created');
            }

            
